<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Compartida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Nuestras Fotos</h1>
            <p>Sube tus imágenes en máxima calidad original</p>
        </header>

        <main>
            <div class="upload-zone" id="dropZone">
                <label for="fileInput" class="upload-label">
                    <span class="icon">📸</span>
                    <span>Seleccionar foto (MÁXIMA CALIDAD)</span>
                </label>
                <input type="file" id="fileInput" accept="image/*,image/heic" style="display: none;">
            </div>

            <div id="statusMessage" class="status-hidden"></div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
