<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestras Fotos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f4f9;
            --card-bg: #ffffff;
            --text-dark: #1e1e24;
            --accent: #2b2d42;
            --radius-large: 30px;
            --radius-small: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding-bottom: 60px;
        }

        /* PORTADA ARREGLADA Y SIN TEXTOS FORMALES */
        .hero {
            /* ¡CORREGIDO A .jpeg! */
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7)), url('portada.jpeg') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 80px 20px 50px;
            border-bottom-left-radius: var(--radius-large);
            border-bottom-right-radius: var(--radius-large);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .names {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            border: none;
        }

        .btn-upload:active {
            transform: scale(0.95);
        }

        /* MENSAJES */
        .status-message {
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
        }
        .status-message.info { display: block; background: rgba(0,0,0,0.5); color: white; backdrop-filter: blur(5px); }
        .status-message.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status-message.error { display: block; background: #ffebee; color: #c62828; }

        /* GALERÍA ARREGLADA */
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .loading {
            text-align: center;
            color: #8d99ae;
            padding: 30px;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: var(--radius-small);
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .photo-image-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #e9ecef;
        }

        .photo-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* BOTÓN DE DESCARGA SIN APLASTAR */
        .photo-actions {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            align-items: center;
        }
        
        .photo-name {
            font-size: 0.75rem;
            color: #8d99ae;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .btn-download {
            background: #edf2f4;
            color: var(--accent);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
        }
        
        .btn-download:active {
            background: #d90429;
            color: white;
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="names">Romer • Luhana • Oriana • Allison • Amira</div>
        
        <div class="upload-wrapper">
            <label for="fileInput" class="btn-upload">
                <i class="fas fa-camera"></i> Subir Foto
            </label>
            <input type="file" id="fileInput" accept="image/*,image/heic" style="display: none;">
            <div id="statusMessage" class="status-message"></div>
        </div>
    </header>

    <main class="gallery-container">
        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i> Cargando fotos...
        </div>
        
        <div class="grid" id="photoGrid"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
