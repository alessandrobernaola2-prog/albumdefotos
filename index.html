<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestra Galería</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Colores cálidos y especiales */
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --bg-color: #fff0f3;
            --surface: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* PORTADA PERSONALIZADA */
        .hero {
            /* Aquí es donde llama a tu archivo portada.jpg */
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('portada.jpeg') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 70px 20px 50px;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.2);
            margin-bottom: 35px;
        }

        .names {
            display: block;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffeaa7; /* Tono dorado/amarillo pastel */
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.05rem;
            opacity: 0.95;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* BOTÓN DE SUBIDA */
        .upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-upload {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #ffffff;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s;
        }

        .btn-upload:active {
            transform: scale(0.95);
        }

        /* MENSAJES */
        .status-message {
            font-size: 0.9rem;
            padding: 12px 20px;
            border-radius: 20px;
            display: none;
            font-weight: 600;
        }
        .status-message.info { display: block; background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.4); }
        .status-message.success { display: block; background: #dcfce7; color: #166534; }
        .status-message.error { display: block; background: #fee2e2; color: #991b1b; }

        /* GALERÍA */
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        /* FOTOS */
        .photo-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 2px solid white;
        }

        .photo-image-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #f8fafc;
        }

        .photo-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-info {
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-download {
            background: var(--bg-color);
            color: var(--primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
        }
        
        .btn-download:active {
            background: #ffe3e8;
        }
    </style>
</head>
<body>

    <header class="hero">
        <span class="names">Romer • Luhana • Oriana • Allison • Amira</span>
        
        <h1>Nuestra Galería</h1>
        <p>Los mejores recuerdos, guardados en máxima calidad.</p>
        
        <div class="upload-wrapper">
            <label for="fileInput" class="btn-upload">
                <i class="fas fa-camera"></i> Guardar Recuerdo
            </label>
            <input type="file" id="fileInput" accept="image/*,image/heic" style="display: none;">
            <div id="statusMessage" class="status-message"></div>
        </div>
    </header>

    <main class="gallery-container">
        <h2 class="section-title">Colección de Fotos</h2>
        
        <div id="loading" class="loading">
            <i class="fas fa-heart fa-beat" style="color: var(--primary); margin-right: 8px;"></i> Buscando recuerdos...
        </div>
        
        <div class="grid" id="photoGrid">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
